<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="780" viewBox="0 0 1600 780">
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101F34"/><stop offset="1" stop-color="#070E19"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#192B42"/><stop offset="1" stop-color="#112036"/></linearGradient><radialGradient id="glow"><stop stop-color="#62B8F4" stop-opacity=".14"/><stop offset="1" stop-color="#62B8F4" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#729CBF" stroke-width="1.6"/></marker></defs>
 <rect width="1600" height="780" rx="28" fill="url(#bg)"/>
 <g font-family="DejaVu Sans, Arial, sans-serif"><text x="72" y="78" font-size="18" fill="#91BEE6" font-weight="600" letter-spacing="2">NIGHT SHIFT  /  HOW IT WORKS</text><text x="72" y="147" font-size="43" fill="#EAF3FC" font-weight="600" >Let work continue, within your limits.</text><text x="72" y="193" font-size="24" fill="#9DB0C6" font-weight="400" >Chat, permissions and monitoring in one place.</text><rect x="72" y="259" width="440" height="340" rx="22" fill="url(#card)" stroke="#2A425E"/><text x="102" y="310" font-size="18" fill="#81BDF0" font-weight="600" >01</text><path d="M438 289 h34 v34" fill="none" stroke="#496C8D" stroke-width="2"/><text x="102" y="385" font-size="28" fill="#EAF3FC" font-weight="600" >Choose your AI</text><text x="102" y="441" font-size="21" fill="#B3C3D6" font-weight="400" >Codex or Claude Code.</text><text x="102" y="477" font-size="21" fill="#B3C3D6" font-weight="400" >Choose your project and</text><text x="102" y="513" font-size="21" fill="#B3C3D6" font-weight="400" >start a managed session.</text><rect x="580" y="259" width="440" height="340" rx="22" fill="url(#card)" stroke="#2A425E"/><text x="610" y="310" font-size="18" fill="#81BDF0" font-weight="600" >02</text><path d="M946 289 h34 v34" fill="none" stroke="#496C8D" stroke-width="2"/><text x="610" y="385" font-size="28" fill="#EAF3FC" font-weight="600" >Take the next step</text><text x="610" y="441" font-size="21" fill="#B3C3D6" font-weight="400" >Chat, attach files and</text><text x="610" y="477" font-size="21" fill="#B3C3D6" font-weight="400" >follow the activity.</text><text x="610" y="513" font-size="21" fill="#B3C3D6" font-weight="400" >You decide on permissions.</text><rect x="1088" y="259" width="440" height="340" rx="22" fill="url(#card)" stroke="#2A425E"/><text x="1118" y="310" font-size="18" fill="#81BDF0" font-weight="600" >03</text><path d="M1454 289 h34 v34" fill="none" stroke="#496C8D" stroke-width="2"/><text x="1118" y="385" font-size="28" fill="#EAF3FC" font-weight="600" >Enable the shift</text><text x="1118" y="441" font-size="21" fill="#B3C3D6" font-weight="400" >If a quota limit interrupts a task,</text><text x="1118" y="477" font-size="21" fill="#B3C3D6" font-weight="400" >the app waits for availability</text><text x="1118" y="513" font-size="21" fill="#B3C3D6" font-weight="400" >and can continue the session.</text><path d="M532 421 h25" stroke="#729CBF" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1040 421 h25" stroke="#729CBF" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="72" y="660" font-size="21" fill="#A4B9D0" font-weight="400" >External sessions have their own rules. See compatibility in the README.</text><line x1="72" y1="702" x2="1528" y2="702" stroke="#23374E"/><text x="72" y="741" font-size="15" fill="#7F98B2" font-weight="400" letter-spacing="1.3">ILLUSTRATED FLOW · NOT AN INTERFACE SCREENSHOT</text></g></svg>