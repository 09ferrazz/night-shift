 <g font-family="DejaVu Sans, Arial, sans-serif"><text x="72" y="78" font-size="18" fill="#91BEE6" font-weight="600" letter-spacing="2">NIGHT SHIFT  /  COMO FUNCIONA</text><text x="72" y="147" font-size="43" fill="#EAF3FC" font-weight="600" >O trabalho continua, dentro dos seus limites.</text><text x="72" y="193" font-size="24" fill="#9DB0C6" font-weight="400" >Conversa, permissões e acompanhamento no mesmo lugar.</text><rect x="72" y="259" width="440" height="340" rx="22" fill="url(#card)" stroke="#2A425E"/><text x="102" y="310" font-size="18" fill="#81BDF0" font-weight="600" >01</text><path d="M438 289 h34 v34" fill="none" stroke="#496C8D" stroke-width="2"/><text x="102" y="385" font-size="28" fill="#EAF3FC" font-weight="600" >Escolha a IA</text><text x="102" y="441" font-size="21" fill="#B3C3D6" font-weight="400" >Codex ou Claude Code.</text><text x="102" y="477" font-size="21" fill="#B3C3D6" font-weight="400" >Selecione seu projeto e</text><text x="102" y="513" font-size="21" fill="#B3C3D6" font-weight="400" >inicie uma sessão gerenciada.</text><rect x="580" y="259" width="440" height="340" rx="22" fill="url(#card)" stroke="#2A425E"/><text x="610" y="310" font-size="18" fill="#81BDF0" font-weight="600" >02</text><path d="M946 289 h34 v34" fill="none" stroke="#496C8D" stroke-width="2"/><text x="610" y="385" font-size="28" fill="#EAF3FC" font-weight="600" >Dê o próximo passo</text><text x="610" y="441" font-size="21" fill="#B3C3D6" font-weight="400" >Converse, envie arquivos e</text><text x="610" y="477" font-size="21" fill="#B3C3D6" font-weight="400" >acompanhe a atividade.</text><text x="610" y="513" font-size="21" fill="#B3C3D6" font-weight="400" >Você decide as permissões.</text><rect x="1088" y="259" width="440" height="340" rx="22" fill="url(#card)" stroke="#2A425E"/><text x="1118" y="310" font-size="18" fill="#81BDF0" font-weight="600" >03</text><path d="M1454 289 h34 v34" fill="none" stroke="#496C8D" stroke-width="2"/><text x="1118" y="385" font-size="28" fill="#EAF3FC" font-weight="600" >Ative o turno</text><text x="1118" y="441" font-size="21" fill="#B3C3D6" font-weight="400" >Se um limite interromper a tarefa,</text><text x="1118" y="477" font-size="21" fill="#B3C3D6" font-weight="400" >o app espera a disponibilidade</text><text x="1118" y="513" font-size="21" fill="#B3C3D6" font-weight="400" >e pode continuar a sessão.</text><path d="M532 421 h25" stroke="#729CBF" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1040 421 h25" stroke="#729CBF" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="72" y="660" font-size="21" fill="#A4B9D0" font-weight="400" >Sessões externas têm regras próprias. Consulte a compatibilidade no README.</text><line x1="72" y1="702" x2="1528" y2="702" stroke="#23374E"/><text x="72" y="741" font-size="15" fill="#7F98B2" font-weight="400" letter-spacing="1.3">FLUXO ILUSTRATIVO · NÃO É UMA CAPTURA DA INTERFACE</text></g></svg>